<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>138億年の人類史</title>
<meta name="theme-color" content="#14110b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Georama:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110b; --card:#1e1a13; --card2:#242019; --line:#332c20; --line2:#4a4130;
  --text:#eae2d3; --sub:#ada189; --dim:#83785f; --accent:#c9a23c;
  --tbh:82px;
  --serif:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --sans:"Noto Sans JP","Hiragino Sans",sans-serif;
  --num:"Georama","Noto Sans JP",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(200,160,60,.15)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.serif{font-family:var(--serif)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.page{max-width:680px;margin:0 auto;padding:0 16px 80px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(20,17,11,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 16px 9px}
.topbar-in{max-width:680px;margin:0 auto}
.brandrow{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand .title{display:block;font-size:16px;font-weight:700;letter-spacing:.06em;line-height:1.3}
.iconbtn{width:38px;height:38px;border:1px solid var(--line2);border-radius:12px;display:grid;place-items:center;color:var(--sub)}
.iconbtn svg{width:17px;height:17px}
.gauge{position:relative;margin-top:8px;height:10px;border-radius:5px;overflow:hidden;background:#0d0b07;border:1px solid var(--line)}
.gauge .seg{position:absolute;top:0;bottom:0;opacity:.9}
.gauge .seg+.seg{border-left:1px solid rgba(20,17,11,.9)}
.playhead{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);border-radius:2px;transition:left .12s linear}

/* ---------- era chips ---------- */
.chips{position:sticky;top:var(--tbh);z-index:40;display:flex;gap:6px;overflow-x:auto;padding:9px 16px;background:rgba(20,17,11,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips-in{display:flex;gap:6px;margin:0 auto}
.chip{flex:0 0 auto;font-size:12px;font-weight:500;color:var(--sub);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;white-space:nowrap}
.chip.on{background:var(--c);border-color:var(--c);color:#14110b;font-weight:700}

/* ---------- hero ---------- */
.hero{padding:30px 2px 6px}
.hero h1{font-size:29px;font-weight:600;line-height:1.42;letter-spacing:.02em;margin:10px 0 12px}
.revhead{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.revhead span{font-size:12.5px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.revhead::after{content:"";flex:1;height:1px;background:var(--line2)}
.revs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.revs::-webkit-scrollbar{display:none}
.rev{flex:0 0 138px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px}
.rev .n{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--rc);line-height:1.2}
.rev .nm{display:block;font-size:13px;font-weight:700;margin-top:2px}
.rev .yr{display:block;font-family:var(--num);font-size:10.5px;color:var(--sub);margin-top:3px;letter-spacing:.03em}
.rev .go{display:block;font-size:9.5px;color:var(--dim);margin-top:6px;letter-spacing:.1em}

/* ---------- era sections ---------- */
.era{padding-top:34px;scroll-margin-top:calc(var(--tbh) + 56px)}
.era-eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:10.5px;font-weight:600;letter-spacing:.18em;color:var(--sub)}
.era-eyebrow::before{content:"";width:20px;height:3px;border-radius:2px;background:var(--c)}
.era-eyebrow .cnt{margin-left:auto;color:var(--dim);letter-spacing:.05em}
.era h2{font-size:25px;font-weight:600;letter-spacing:.03em;margin:6px 0 8px}
.era .blurb{font-size:12.5px;color:var(--sub);line-height:1.95}
.minigauge{margin-top:12px}
.minigauge .track{position:relative;height:6px;border-radius:3px;background:#0d0b07;border:1px solid var(--line)}
.minigauge .mark{position:absolute;top:-1px;bottom:-1px;border-radius:3px;background:var(--c)}
.minigauge .cap{display:flex;justify-content:space-between;font-family:var(--num);font-size:8.5px;letter-spacing:.14em;color:var(--dim);margin-top:4px}

/* ---------- event cards ---------- */
.tl{margin-top:16px;position:relative}
.ev{display:grid;grid-template-columns:22px 1fr;gap:0 10px;width:100%;text-align:left;padding:0;margin:0 0 10px;transition:transform .2s ease}
.ev:active{transform:scale(.985)}
.ev .rail{position:relative}
.ev .rail::before{content:"";position:absolute;left:9px;top:0;bottom:-10px;width:2px;background:linear-gradient(var(--c2),var(--c2))}
.ev:last-child .rail::before{bottom:auto;height:22px}
.ev .dot{position:absolute;left:5px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--c2)}
.evcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px}
.evcard time{font-family:var(--num);font-size:11.5px;font-weight:600;color:var(--c);letter-spacing:.05em}
.evcard .t{display:block;font-size:15px;font-weight:700;line-height:1.5;margin-top:3px}
.evcard .s{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:12px;color:var(--sub);line-height:1.75;margin-top:4px}
.evcard .more{display:inline-block;font-size:10px;color:var(--dim);letter-spacing:.12em;margin-top:7px}

/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(103%);transition:transform .32s cubic-bezier(.32,.72,.24,1)}
.sheet.on{transform:none}
.sheet-in{max-width:680px;margin:0 auto;background:#1b1712;border:1px solid var(--line2);border-bottom:none;border-radius:20px 20px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto}
.handle{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.sheet .pillrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet .pill{font-size:10.5px;font-weight:700;letter-spacing:.08em;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.07);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.sheet time{font-family:var(--num);font-size:13px;font-weight:600;color:var(--c);letter-spacing:.05em}
.sheet h3{font-size:21px;font-weight:600;line-height:1.5;margin:8px 0 10px;letter-spacing:.02em}
.sheet .d{font-size:13.5px;line-height:2.05;color:#d8cfbd}
.sheet .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.sheet .tag{font-size:10.5px;color:var(--sub);border:1px solid var(--line2);border-radius:999px;padding:2px 9px}
.sheet .sect{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--sub);margin:20px 0 8px;display:flex;align-items:center;gap:10px}
.sheet .sect::after{content:"";flex:1;height:1px;background:var(--line)}
.rel{display:flex;gap:6px;flex-wrap:wrap}
.rel button{font-size:11.5px;color:var(--text);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:6px 11px;text-align:left}
.rel button .ry{font-family:var(--num);font-size:9.5px;color:var(--sub);display:block}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.pn button{font-size:12px;color:var(--sub);border:1px solid var(--line2);border-radius:12px;padding:10px;text-align:center}
.sheet .x{position:sticky;top:0;float:right;margin:-4px -8px 0 0;width:36px;height:36px;display:grid;place-items:center;color:var(--sub);z-index:2}

.source-note{font-size:12px;color:var(--sub);line-height:1.9;margin-top:12px}
.source-link{font-size:12px;color:var(--text);text-decoration:underline;overflow-wrap:anywhere}

/* ---------- search overlay ---------- */
.searcho{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column}
.searcho.on{display:flex}
.searcho-in{max-width:680px;width:100%;margin:0 auto;padding:14px 16px;overflow-y:auto}
.srow{display:flex;gap:10px;align-items:center}
.sinput{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:12px;color:var(--text);font-family:inherit;font-size:16px;padding:11px 14px}
.sinput::placeholder{color:var(--dim)}
.scount{font-family:var(--num);font-size:11px;color:var(--sub);margin:12px 2px 8px;letter-spacing:.08em}
.sempty{font-size:13px;color:var(--sub);padding:30px 4px;line-height:2}
.shint{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.9}
#results .ev{margin-top:0}

@media (min-width:720px){
  .hero h1{font-size:34px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brandrow">
      <div class="brand">
        <span class="title serif">138億年の人類史</span>
      </div>
      <button class="iconbtn" id="searchBtn" aria-label="出来事を検索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="gauge" id="gauge" aria-hidden="true"><div class="playhead" id="playhead" style="left:0%"></div></div>
  </div>
</header>

<nav class="chips" aria-label="時代で移動"><div class="chips-in" id="chips"></div></nav>

<div class="page">
  <section class="hero">
    <h1 class="serif">138億年の人類史</h1>
    <div class="revhead"><span>5つの転換点で見る</span></div>
    <div class="revs" id="revs"></div>
    <p class="source-note">全体像をつかむための、このサイト独自の整理です。</p>
  </section>
  <div id="timeline"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-in" id="sheetIn"></div>
</div>

<div class="searcho" id="searcho">
  <div class="searcho-in">
    <div class="srow">
      <input class="sinput" id="sinput" type="search" placeholder="出来事・時代・テーマで検索" autocomplete="off">
      <button class="iconbtn" id="sClose" aria-label="検索を閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="shint" id="shint">例：仏陀 / 蒸気機関 / 農業 / ペスト / イスラーム / ダーウィン</div>
    <div class="scount" id="scount" hidden></div>
    <div id="results"></div>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* compressed-time position (0..1) of a year for the depth gauges.
   Piecewise-linear anchors at era boundaries: monotonic, every era stays
   visible, deep time keeps the left half. (A raw log10(y+offset) formula
   degenerates — LSPAN collapses to ~1e-7 — so we anchor by design.) */
const T_ANCHORS=[[-13800000000,0],[-4600000000,.10],[-3800000000,.16],[-2500000,.30],
 [-300000,.38],[-10000,.50],[-5200,.56],[-2800,.60],[500,.68],[1450,.76],[1760,.83],[1945,.90],[2100,1]];
function frac(y){
  if(y<=T_ANCHORS[0][0])return 0;
  for(let i=1;i<T_ANCHORS.length;i++){
    if(y<=T_ANCHORS[i][0]){
      const a=T_ANCHORS[i-1],b=T_ANCHORS[i];
      return a[1]+(b[1]-a[1])*(y-a[0])/(b[0]-a[0]);
    }
  }
  return 1;
}

let ERA_BY_ID={}, evIndex=new Map(), currentSheet=0;
let returnToSearch=false;

function makeCard(ev){
  const era=ERA_BY_ID[ev.era];
  return `<button class="ev" data-ev="${ev.id}" style="--c:${era.color};--c2:${era.color}55">
    <span class="rail" aria-hidden="true"><span class="dot"></span></span>
    <span class="evcard"><time>${esc(ev.label)}</time><span class="t">${esc(ev.t)}</span><span class="s">${esc(ev.s)}</span><span class="more">読む →</span></span>
  </button>`;
}

function buildGauge(){
  $("#gauge").insertAdjacentHTML("afterbegin", ERAS.map(e=>{
    const a=frac(e.from)*100, b=frac(e.to)*100;
    return `<div class="seg" style="left:${a}%;width:${b-a}%;background:${e.color}" title="${esc(e.name)}"></div>`;
  }).join(""));
}

function buildChips(){
  $("#chips").innerHTML=ERAS.map(e=>`<button class="chip" data-era="${e.id}" style="--c:${e.color}">${esc(e.name)}</button>`).join("");
}

function buildRevs(){
  $("#revs").innerHTML=REVS.map(r=>{
    const e=ERA_BY_ID[r.era];
    return `<button class="rev" data-era="${r.era}" style="--rc:${e.color}"><span class="n">${r.n}</span><span class="nm">${esc(r.name)}</span><span class="yr">${esc(r.yr)}</span><span class="go">時代へ →</span></button>`;
  }).join("");
}

function buildTimeline(){
  $("#timeline").innerHTML=ERAS.map(e=>{
    const evs=EVENTS.filter(v=>v.era===e.id).sort((a,b)=>a.y-b.y);
    const a=frac(e.from)*100, b=frac(e.to)*100;
    return `<section class="era" id="era-${e.id}" style="--c:${e.color}">
      <div class="era-eyebrow"><span>${esc(e.range)}</span><span class="cnt">${evs.length}出来事</span></div>
      <h2 class="serif">${esc(e.name)}</h2>
      <p class="blurb">${esc(e.blurb)}</p>
      <div class="minigauge" aria-hidden="true">
        <div class="track"><div class="mark" style="left:${a}%;width:${b-a}%"></div></div>
        ${e.id==="origin"?'<div class="cap"><span>138億年前</span><span>時間の深さ（圧縮表示）</span><span>現在</span></div>':''}
      </div>
      <div class="tl">${evs.map(makeCard).join("")}</div>
    </section>`;
  }).join("");
}

function openEvent(id){
  const i=EVENTS.findIndex(e=>e.id===id);
  if(i<0)return;
  if($("#searcho").classList.contains("on")){
    returnToSearch=true;
    $("#searcho").classList.remove("on");
    $("#sinput").blur();
  }
  currentSheet=i;
  renderSheet();
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("on");
  document.body.style.overflow="hidden";
  $("#sheetIn").scrollTop=0;
}
function closeSheet(){
  $("#scrim").classList.remove("on");
  $("#sheet").classList.remove("on");
  if(returnToSearch){
    returnToSearch=false;
    $("#searcho").classList.add("on");
    document.body.style.overflow="hidden";
    $("#sClose").focus();
  }else{
    document.body.style.overflow="";
  }
}
function renderSheet(){
  const ev=EVENTS[currentSheet], era=ERA_BY_ID[ev.era];
  const rel=EVENTS.map((v,j)=>({j,n:v.tags.filter(t=>ev.tags.includes(t)).length}))
    .filter(v=>v.n>0&&v.j!==currentSheet).sort((a,b)=>b.n-a.n||Math.abs(EVENTS[a.j].y-ev.y)-Math.abs(EVENTS[b.j].y-ev.y)).slice(0,6);
  $("#sheetIn").innerHTML=`
    <button class="x" id="sheetX" aria-label="閉じる"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="handle"></div>
    <div class="pillrow" style="--c:${era.color}"><span class="pill">${esc(era.name)}</span><time>${esc(ev.label)}</time></div>
    <h3 class="serif">${esc(ev.t)}</h3>
    <p class="d">${esc(ev.d)}</p>
    ${ev.note?`<p class="source-note">${esc(ev.note)}</p>`:""}
    <div class="sect">参考資料</div>
    ${ev.sources?.length?ev.sources.map(s=>`<p><a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></p>`).join(""):'<p class="source-note">個別資料との照合は未完了です。この項目は学習用の概説であり、年代・解釈は今後見直します。</p>'}
    <div class="tags">${ev.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
    <div class="sect">共通テーマの出来事</div>
    <div class="rel">${rel.map(v=>`<button data-ev="${EVENTS[v.j].id}"><span class="ry">${esc(EVENTS[v.j].label)}</span>${esc(EVENTS[v.j].t)}</button>`).join("")||'<span class="tag">—</span>'}</div>
    <div class="pn">
      <button data-ev="${EVENTS[(currentSheet-1+EVENTS.length)%EVENTS.length].id}">← 前の出来事</button>
      <button data-ev="${EVENTS[(currentSheet+1)%EVENTS.length].id}">次の出来事 →</button>
    </div>`;
  $("#sheetX").addEventListener("click",closeSheet);
}

/* scroll: active chip + playhead descent
   window(era i) = [top_i, top_{i+1}) in "midline" coords c=scrollY+vh/2;
   the last era ends at max scroll so the playhead can reach the far right. */
let ranges=[];
function measure(){
  const secs=ERAS.map(e=>{
    const el=document.getElementById("era-"+e.id);
    return {id:e.id,from:e.from,to:e.to,top:el?el.offsetTop:0};
  });
  ranges=secs.map((r,i)=>Object.assign(r,{end:i<secs.length-1?secs[i+1].top:r.top+1}));
}
function paint(){
  if(!ranges.length)return;
  const half=innerHeight/2;
  const c=scrollY+half;
  const last=ranges[ranges.length-1];
  last.end=Math.max(last.top+1,document.documentElement.scrollHeight-half+1);
  let r=ranges.find(r=>c>=r.top&&c<r.end)||ranges[0];
  document.querySelectorAll(".chip").forEach(ch=>ch.classList.toggle("on",ch.dataset.era===r.id));
  const p=Math.min(1,Math.max(0,(c-r.top)/(r.end-r.top)));
  $("#playhead").style.left=(frac(r.from+(r.to-r.from)*p)*100)+"%";
}
/* one rAF-batched update that ALWAYS re-measures then repaints — a viewport
   change (rotate / URL-bar / font settle / dynamic layout) can never leave
   stale geometry behind. Re-measure is 9 offsetTop reads: negligible. */
let scheduled=false;
function update(){ measure(); paint(); }
function schedule(){
  if(scheduled)return;
  scheduled=true;
  requestAnimationFrame(()=>{scheduled=false;update();});
}
function scrollToEra(id){
  document.getElementById("era-"+id).scrollIntoView({behavior:"smooth",block:"start"});
}

/* search */
function openSearch(){document.body.style.overflow="hidden";$("#searcho").classList.add("on");$("#sinput").focus();renderSearch();}
function closeSearch(){document.body.style.overflow="";$("#searcho").classList.remove("on");$("#sinput").value="";renderSearch();}
function renderSearch(){
  const q=$("#sinput").value.trim();
  const cnt=$("#scount"), res=$("#results"), hint=$("#shint");
  if(!q){cnt.hidden=true;res.innerHTML="";hint.hidden=false;return;}
  const ql=q.toLowerCase();
  const hits=EVENTS.filter(e=>(e.t+e.s+e.d+e.tags.join()+e.label).toLowerCase().includes(ql));
  hint.hidden=true;
  cnt.hidden=false;
  cnt.textContent=`${hits.length}件`;
  res.innerHTML=hits.length
    ? `<div class="tl" style="margin-top:8px">${hits.map(makeCard).join("")}</div>`
    : `<div class="sempty">該当する出来事はありません。別の語で試してください（例：革命 / 帝国 / 文字）。</div>`;
}

/* shared click delegation */
document.addEventListener("click",e=>{
  const ev=e.target.closest("[data-ev]");
  if(ev){openEvent(ev.dataset.ev);return;}
  const er=e.target.closest("[data-era]");
  if(er){scrollToEra(er.dataset.era);}
});
$("#scrim").addEventListener("click",closeSheet);
$("#searchBtn").addEventListener("click",openSearch);
$("#sClose").addEventListener("click",closeSearch);
$("#sinput").addEventListener("input",renderSearch);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#sheet").classList.contains("on"))closeSheet();else closeSearch();}
});
addEventListener("scroll",schedule,{passive:true});
addEventListener("resize",schedule);
addEventListener("orientationchange",()=>{schedule();setTimeout(schedule,300);});

{id:"quantum",era:"modern",y:1900,label:"西暦1900年",t:"量子論の誕生",

{id:"relativity",era:"modern",y:1915,label:"西暦1915年",t:"アインシュタイン、相対性理論",
 s:"時間と空間は絶対ではなく、観測者と重力で変わる。",
 d:"1905年に特殊相対性理論（光速は不変で、時間と空間は観測者の運動によって変わる）を発表した。アインシュタインが1921年に受けたノーベル賞は相対性理論ではなく、光電効果の理論に対するものだった。1915年の一般相対性理論は重力を、質量が時空を曲げる効果として説明し、1919年の皆既日食で星の光の曲がりが観測されて評価を確立した。のちの宇宙論・ブラックホール研究の基礎であり、GPSの補正にも使われている。",

{id:"tycho",era:"early",y:1572,label:"西暦1572年",t:"ティコ・ブラーエの精密観測",

 d:"1572年、ティコはカシオペヤ座に突然現れた新星（超新星）を観測した。月より遠くにあることを示し、「天は不変」という古い教義が崩れた。デンマーク王の支援でウラニボリ給観測所を建て、望遠鏡以前の観測技術の限界を極めて、惑星の位置を歴代最高精度（誤差約1〜2分角）で20年間記録した。地動説には距離論から最後まで懐疑的だったが、彼の真の遺産はこのデータだった。晩年の助手ケプラーに渡った火星の観測記録が、軌道理論を更新する。コペルニクス（1543）とガリレオ（1610）の間をつなぐ、観測の土台である。",
 tags:["科学","宇宙"]},
{id:"kepler",era:"early",y:1609,label:"西暦1609年",t:"楕円軌道の発見",
 s:"惑星の軌道は円ではなく楕円だった。2000年の円信仰が終わった。",
 d:"ティコの火星観測データと、円軌道の理論の間にわずか8分角のずれを発見したケプラーは、円への執着を捨て、1609年に楕円軌道と面積速度法則（第1・第2法則）、1619年に周期の法則（第3法則）を導いた。惑星の運動が「完璧な円」という古代以来の信念ではなく、数学的な法則で精密に記述できると示した。なぜ楕円なのかは当時謎のままで、その答えはニュートンの万有引力（1687年）まで待つことになる。",
 tags:["科学","宇宙"]},
{id:"galileo",era:"early",y:1610,label:"西暦1610年",t:"望遠鏡観測の始まり",

 d:"1609年に自作の望遠鏡で天を観測したガリレオは、木星の衛星、月の山、金星の満ち欠けを発見した。天が完璧で不変な別世界ではなく、地球と同じ物理法則に従うことを示唆する観測だった。コペルニクスの地動説に実証的な裏付けを与え、観測と検証を重んじる近代科学の流れを決定づけ、のちのニュートンによる万有引力の統一へ続く。",

{id:"vaccine",era:"modern",y:1796,label:"西暦1796年",t:"種痘と細菌説——医学革命",
 s:"病の原因が見えるようになって、寿命が倍になった。",
 d:"1796年、ジェンナーが牛痘接種で天然痘の予防を実証した（ワクチンの始まり）。1854年、スノーはコレラ死者の分布を地図に重ね、水源が感染経路だと突き止めた。1860〜80年代にパスツールとコッホが細菌説を確立し、「病気の原因」が目に見える対象になった。衛生・清掃・ワクチン・消毒の組み合わせは、先進国の平均寿命を19世紀の40歳前後から20世紀に倍増させた。科学が死因を変えた最初の大例である。",

{id:"penicillin",era:"modern",y:1928,label:"西暦1928年",t:"ペニシリンの発見",
 s:"カビの一種が、感染症との最初の勝利をもたらした。",
 d:"1928年、フレミングが培養皿に混入したアオカビがブドウ球菌を殺すのに気づいた。フローリーとチェインが1940年代に実用化し、三人は1945年のノーベル生理学・医学賞を受けた。抗生物質の時代が開き、肺炎や敗血症、戦傷感染が治る病気になった。手術と臓器移植が安全になる一方、使いすぎによる耐性菌が新たな脅威として残った。",
 tags:["科学","医療"]},
{id:"hubble",era:"modern",y:1929,label:"西暦1929年",t:"宇宙の膨張の発見",
 s:"遠い銀河ほど速く遠ざかる。宇宙は広がり続けている。",

{id:"dna",era:"now",y:1953,label:"西暦1953年",t:"DNA二重らせん構造",

{id:"tectonics",era:"now",y:1968,label:"西暦1968年ごろ",t:"プレートテクトニクスの確立",

 d:"1912年、ウェゲナーの大陸移動説はメカニズムが示せず長く退けられた。1960年代、海底拡大の証拠（海底の磁気の縞模様など）が蓄積し、1968年ごろに地球表面が十数枚のプレートで覆われるという理論として確立した。地震・火山・山脈・大陸の配置が単一の枠組みで説明され、大陸の分裂や古気候の復元など地球史の読み方が一変した。日本の地震・火山研究の基盤でもある。",

{id:"crispr",era:"now",y:2012,label:"西暦2012年ごろ",t:"ゲノム編集（CRISPR）",

 d:"2003年にヒトゲノムの解読が完了し、2012年ごろ、ダウドナとシャルパンティエが細菌の免疫系を応用したCRISPR-Cas9によるゲノム編集法を確立し（2020年ノーベル化学賞）、誰でも使える分子工具になった。農作物の品種改良、遺伝病治療（鎌状赤血球症の治療薬が2023年に承認）、基礎研究を一変させた。一方、受精卵の編集など人間の遺伝をどう扱うかという倫理的課題も同時に始まった。",

{id:"ww1",era:"modern",y:1914,label:"1914年",t:"第一次世界大戦",

{id:"depression",era:"modern",y:1929,label:"1929年",t:"世界恐慌",

{id:"ww2",era:"modern",y:1939,label:"1939年",t:"第二次世界大戦",

{id:"transistor",era:"now",y:1947,label:"1947年",t:"トランジスタの発明",

{id:"sputnik",era:"now",y:1957,label:"1957年",t:"スプートニク打ち上げ",

{id:"micro",era:"now",y:1971,label:"1971年",t:"マイクロプロセッサ",

{id:"berlin",era:"now",y:1989,label:"1989年",t:"ベルリンの壁崩壊",

{id:"www",era:"now",y:1991,label:"1991年",t:"WWWの公開",

{id:"iphone",era:"now",y:2007,label:"2007年",t:"スマートフォンの登場",

{id:"covid",era:"now",y:2020,label:"2020年",t:"新型コロナのパンデミック",

{id:"ai",era:"now",y:2022,label:"2022年",t:"生成AIの登場",

const DATE_REFERENCE=2000;
function yearText(y){return y<0?`紀元前${Math.abs(y).toLocaleString("ja-JP")}年`:`西暦${y.toLocaleString("ja-JP")}年`;}
function ageText(age){
  if(age>=1e8)return `${Number((age/1e8).toFixed(2))}億`;
  if(age>=1e4)return `${Number((age/1e4).toFixed(2))}万`;
  return age.toLocaleString("ja-JP");
}
function normalizeContent(){
  const byId=Object.fromEntries(EVENTS.map(e=>[e.id,e]));
  // These original records used negative elapsed years rather than BCE.
  for(const e of EVENTS)if(["origin","forager"].includes(e.era)&&e.id!=="gobekli")e.y+=DATE_REFERENCE;
  Object.assign(byId.habilis,{
    y:-2398000,t:"ホモ・ハビリス",
    s:"初期のホモ属の一種。約240万〜140万年前にアフリカで生息した。",
    d:"ホモ・ハビリスは、東部・南部アフリカに生息した初期のホモ属の一種。『器用な人』という名前は石器製作者と考えられたことに由来する。ただし同じ時代・地域には他の人類もおり、石器の製作者をハビリスだけに特定することはできない。約280万年前の初期ホモ属の顎骨を、そのままハビリスと同定することもできない。エレクトスとも生存期間が重なり、単純な一列の進化ではない。",
    note:"生息年代・分類・祖先関係は、新しい化石や分析により見直される。",
    sources:[{title:"スミソニアン：ホモ・ハビリス",url:"https://humanorigins.si.edu/evidence/human-fossils/species/homo-habilis"},{title:"ペンシルベニア州立大学：初期ホモ属の顎骨（約280万年前）",url:"https://www.psu.edu/news/research/story/earliest-known-fossil-genus-homo-dates-28-275-million-years-ago"}]
  });
  Object.assign(byId.oldowan,{
    y:-3298000,t:"ロメクウィ3の石器",
    s:"ケニアで報告された約330万年前の石器。初期ホモ属の証拠より古い。",
    d:"ケニアのロメクウィ3では、約330万年前の地層から石器が報告された。2015年の論文は、石核を打ち割る作業や打撃作業の痕跡を示し、ロメクウィアンという名称を提案した。石器づくりをホモ属だけの特徴とみなす見方に再検討を迫る発見である。誰が作ったのかは特定されていない。",
    note:"『最初に発明された時点』と『現在見つかっている証拠の年代』は異なる。",
    sources:[{title:"Harmandほか（2015）：ロメクウィ3の約330万年前の石器",url:"https://pubmed.ncbi.nlm.nih.gov/25993961/"}]
  });
  Object.assign(byId.cognitive,{
    t:"認知革命という見方",
    s:"言語・象徴・共有する物語の重要性を考えるための整理。",
    d:"このサイトでは、言語や象徴、共有する物語と大規模な協力の関係を考える入口として『認知革命』を置いている。約7万年前を唯一の転換点とする確定した区分ではない。能力の成立過程や変化の時期は、化石・考古資料・遺伝学などを通じて検討する必要がある。",
    note:"解釈・整理のための項目。特定の年に言語や虚構が誕生したという意味ではない。"
  });
  // Era boundaries are editorial buckets, not universal historical periods.
  const bounds=[-13800000000,-298000,-10000,-4000,-800,500,1450,1760,1945,2100];
  ERAS.forEach((e,i)=>{
    e.from=bounds[i];e.to=bounds[i+1];
    e.range=i===0?"宇宙の誕生〜約30万年前":i===1?"約30万年前〜紀元前10,000年":i===8?"西暦1945年〜現在":`${yearText(e.from)}〜${yearText(e.to)}`;
  });
  for(const e of EVENTS){
    const i=ERAS.findIndex((r,i)=>e.y>=r.from&&(e.y<r.to||i===ERAS.length-1));
    if(i>=0)e.era=ERAS[i].id;
    if(!["price","future"].includes(e.id)){
      e.label=e.y < -10000?`約${ageText(DATE_REFERENCE-e.y)}年前`:`${yearText(e.y)}${e.y<0?"ごろ":""}`;
    }
  }
  byId.habilis.label="約240万〜140万年前";
  EVENTS.sort((a,b)=>a.y-b.y||a.id.localeCompare(b.id));
}
